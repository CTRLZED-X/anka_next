name: chat08-pr35-release-context

on:
  push:
    branches: [agent/08-adversarial-qa]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  TARGET_SHA: 47803bd57e4a37931f019df31236264892e95e72

jobs:
  linux-release-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Exact identity
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$actual"
          test "$actual" = "$TARGET_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-p1.txt
      - name: Expected unresealed release check
        run: |
          set +e
          python tools/verify_release_offline.py
          rc=$?
          echo "RELEASE_CHECK_EXIT=$rc"
          test "$rc" -ne 0

  windows-runtime-context:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Exact identity
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          Write-Host "EXPECTED_SHA=$env:TARGET_SHA"
          Write-Host "ACTUAL_SHA=$actual"
          if ($actual -ne $env:TARGET_SHA) { throw "CHECKOUT_SHA_MISMATCH" }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-p1.txt -r requirements-windows-capture.txt
      - name: Expected unresealed runtime integrity
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from anka_app.release_integrity import verify_release_integrity
          r=verify_release_integrity(Path('.'))
          print(r.safe_receipt())
          assert r.status == 'FAIL'
          '@ | python -
