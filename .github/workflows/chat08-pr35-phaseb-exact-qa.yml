name: chat08-pr35-phaseb-exact-qa

on:
  push:
    branches: [agent/08-adversarial-qa]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  TARGET_SHA: 47803bd57e4a37931f019df31236264892e95e72

jobs:
  exact-head-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR35 head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Assert exact source identity
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$actual"
          test "$actual" = "$TARGET_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-p1.txt

      - name: Compile relevant packages
        run: python -m compileall -q src/anka_contracts src/anka_app src/anka_workflow src/anka_coordination

      - name: Phase B focused
        run: python -m pytest -q tests/test_agent06_issue32_phase_b.py

      - name: Previous Chat06 suite
        run: python -m pytest -q tests/test_agent06_coordination_workflow.py

      - name: Frozen Phase A suite
        run: python -m pytest -q tests/test_agent10_issue32_workflow_contract_migration.py

      - name: Combined authority suite
        run: |
          python -m pytest -q             tests/test_agent06_issue32_phase_b.py             tests/test_agent06_coordination_workflow.py             tests/test_agent10_issue32_workflow_contract_migration.py

      - name: Retained Q6 P17 Q9 M12 architecture matrix
        run: |
          python -m pytest -q             tests/test_m9_m10_q6.py             tests/test_p17_coordination_workflow.py             tests/test_q9_zero_input_integration.py             tests/test_m12_003_live_readiness_hardening.py             tests/test_m12_006_phase_authority_and_full_chain.py             tests/test_m1_architecture_gate.py

      - name: Independent Phase B adversarial matrix
        run: |
          python - <<'PY'
          from dataclasses import replace
          from pathlib import Path

          from anka_contracts.workflow import MissionConfigSpec, WorkflowSignal
          from anka_workflow.compiler import compile_mission
          from anka_workflow.engine import MissionWorkflow, WorkflowRejected

          ROOT=Path.cwd()
          ROUTES=ROOT/"assets"/"workflow"/"routes.json"

          def mission(*,watchdog=1,recovery=4,target=2,max_attempts=3):
              cfg=MissionConfigSpec(
                  "sufokia_direction_cycle",1,8,target,max_attempts,False,False,"b"*64
              )
              return compile_mission(
                  cfg,ROUTES,watchdog_budget_ticks=watchdog,recovery_budget=recovery
              )

          counter=0
          def sig(kind,tick,*,fight=None,result=None,action=None,status=None,encounter=None,map_id=None,recovery_generation=None):
              global counter
              counter+=1
              return WorkflowSignal(
                  f"wfsig-chat08-pb-{counter}",kind,tick,(f"evidence-chat08-pb-{counter}",),
                  fight_epoch=fight,fight_result=result,action_id=action,action_status=status,
                  encounter_id=encounter,encounter_map_id=map_id,
                  recovery_generation=recovery_generation,
              )

          def apply_ok(w,s):
              r=w.apply(s)
              assert r.status=="APPLIED",(s.kind,r.status,r.reason,r.snapshot)
              return r

          def advance_to_ready(w):
              apply_ok(w,sig("START",0))
              apply_ok(w,sig("PREFLIGHT_OK",1))
              apply_ok(w,sig("ENCOUNTER_SELECTED",2,encounter="encounter-chat08",map_id=1001))
              apply_ok(w,sig("FIGHT_ENTRY_PROVEN",3,fight=1))
              apply_ok(w,sig("PARTY_JOIN_PROVEN",4,fight=1))
              apply_ok(w,sig("PLACEMENT_PROVEN",5,fight=1))
              apply_ok(w,sig("READY_PROVEN",6,fight=1))

          # 1) Recovery generation lifecycle + outcome fencing.
          w=MissionWorkflow("run-chat08-life",mission())
          assert (w.snapshot().recovery_generation,w.snapshot().active_recovery_generation)==(0,None)
          advance_to_ready(w)
          a=apply_ok(w,sig("WATCHDOG",w.snapshot().watchdog_deadline_tick+1))
          assert (a.snapshot.recovery_generation,a.snapshot.active_recovery_generation,a.snapshot.resume_phase)==(1,1,"READY")
          b=apply_ok(w,sig("WATCHDOG",a.snapshot.watchdog_deadline_tick+1))
          assert (b.snapshot.recovery_generation,b.snapshot.active_recovery_generation,b.snapshot.resume_phase)==(2,2,"READY")
          wm=b.snapshot.last_processed_tick
          for kind in ("RECOVERY_SUCCEEDED","RECOVERY_FAILED"):
              stale=w.apply(sig(kind,wm+1,recovery_generation=1))
              assert stale.status=="REJECTED" and stale.snapshot.last_processed_tick==wm,(kind,stale)
          missing=w.apply(sig("RECOVERY_SUCCEEDED",wm+1))
          assert missing.status=="REJECTED" and missing.snapshot.last_processed_tick==wm
          future=w.apply(sig("RECOVERY_FAILED",wm+1,recovery_generation=3))
          assert future.status=="REJECTED" and future.snapshot.last_processed_tick==wm
          good=apply_ok(w,sig("RECOVERY_SUCCEEDED",wm+1,recovery_generation=2))
          assert good.snapshot.phase=="READY"
          assert good.snapshot.recovery_generation==2 and good.snapshot.active_recovery_generation is None
          settled_wm=good.snapshot.last_processed_tick
          dup=w.apply(sig("RECOVERY_SUCCEEDED",settled_wm+50,recovery_generation=2))
          assert dup.status=="DUPLICATE"
          assert dup.snapshot.last_processed_tick==settled_wm
          print("RECOVERY_LIFECYCLE_AND_FENCING=PASS")

          wf=MissionWorkflow("run-chat08-fail",mission())
          advance_to_ready(wf)
          apply_ok(wf,sig("WATCHDOG",wf.snapshot().watchdog_deadline_tick+1))
          b2=apply_ok(wf,sig("WATCHDOG",wf.snapshot().watchdog_deadline_tick+1))
          fail=apply_ok(wf,sig("RECOVERY_FAILED",b2.snapshot.last_processed_tick+1,recovery_generation=2))
          assert fail.snapshot.phase=="BLOCKED"
          assert fail.snapshot.recovery_generation==2 and fail.snapshot.active_recovery_generation is None
          print("RECOVERY_FAILURE_SETTLEMENT=PASS")

          # Direct malformed in-memory recovery input cannot bypass correlation.
          wm=MissionWorkflow("run-chat08-direct-malformed",mission())
          advance_to_ready(wm)
          rec=apply_ok(wm,sig("WATCHDOG",wm.snapshot().watchdog_deadline_tick+1))
          malformed=WorkflowSignal("wfsig-chat08-malformed","RECOVERY_SUCCEEDED",rec.snapshot.last_processed_tick+1)
          direct=wm.apply(malformed)
          assert direct.status=="REJECTED" and direct.reason=="RECOVERY_IDENTITY_MISSING"
          print("DIRECT_MALFORMED_RECOVERY=PASS")

          # 2) Watermark + watchdog separation, including same tick.
          wt=MissionWorkflow("run-chat08-time",mission(watchdog=5))
          s0=wt.snapshot()
          start=apply_ok(wt,sig("START",0))
          assert start.snapshot.last_processed_tick==0
          world=apply_ok(wt,sig("PREFLIGHT_OK",1))
          before=world.snapshot
          obs=apply_ok(wt,sig("WORLD_OBSERVED",100))
          assert obs.snapshot.last_processed_tick==100
          assert obs.snapshot.phase_started_tick==before.phase_started_tick
          assert obs.snapshot.watchdog_deadline_tick==before.watchdog_deadline_tick
          assert obs.snapshot.progress_generation==before.progress_generation
          hb=apply_ok(wt,sig("HEARTBEAT",100))
          assert hb.snapshot.last_processed_tick==100
          assert hb.snapshot.phase_started_tick==before.phase_started_tick
          assert hb.snapshot.watchdog_deadline_tick==before.watchdog_deadline_tick
          assert hb.snapshot.progress_generation==before.progress_generation
          below=wt.apply(sig("WORLD_OBSERVED",99))
          assert below.status=="REJECTED" and below.snapshot.last_processed_tick==100
          same=apply_ok(wt,sig("WORLD_OBSERVED",100))
          assert same.snapshot.last_processed_tick==100
          higher=apply_ok(wt,sig("WORLD_OBSERVED",101))
          assert higher.snapshot.last_processed_tick==101
          print("WATERMARK_AND_WATCHDOG_SEPARATION=PASS")

          # 3) Resume/restart.
          snap=wt.snapshot()
          try:
              MissionWorkflow.resume(wt.plan,snap,resume_tick=50)
          except WorkflowRejected as exc:
              assert "RESUME_TICK_REGRESSION" in str(exc)
          else:
              raise AssertionError("resume below watermark accepted")
          resumed=MissionWorkflow.resume(wt.plan,snap,resume_tick=101)
          assert resumed.snapshot().last_processed_tick==101
          assert resumed.snapshot().phase_started_tick==101

          wr=MissionWorkflow("run-chat08-restart",mission(watchdog=2))
          advance_to_ready(wr)
          a=apply_ok(wr,sig("WATCHDOG",wr.snapshot().watchdog_deadline_tick+1))
          restarted=MissionWorkflow.resume(wr.plan,a.snapshot,resume_tick=a.snapshot.last_processed_tick)
          rs=restarted.snapshot()
          assert (rs.phase,rs.active_recovery_generation,rs.recovery_generation,rs.resume_phase)==("RECOVERING",1,1,"READY")
          b=apply_ok(restarted,sig("WATCHDOG",rs.watchdog_deadline_tick+1))
          stale=restarted.apply(sig("RECOVERY_SUCCEEDED",b.snapshot.last_processed_tick+1,recovery_generation=1))
          assert stale.status=="REJECTED" and stale.snapshot.active_recovery_generation==2

          wp=MissionWorkflow("run-chat08-pending",mission(watchdog=2))
          advance_to_ready(wp)
          sub=apply_ok(wp,sig("ACTION_SUBMITTED",7,fight=1,action="action-chat08"))
          try:
              MissionWorkflow.resume(wp.plan,sub.snapshot,resume_tick=sub.snapshot.last_processed_tick)
          except WorkflowRejected as exc:
              assert "PENDING_ACTION" in str(exc)
          else:
              raise AssertionError("pending action resumed")

          wterm=MissionWorkflow("run-chat08-terminal",mission())
          stopped=apply_ok(wterm,sig("STOP_REQUESTED",0))
          resumed_term=MissionWorkflow.resume(wterm.plan,stopped.snapshot,resume_tick=0)
          assert resumed_term.snapshot()==stopped.snapshot
          after=resumed_term.apply(sig("HEARTBEAT",1))
          assert after.status=="REJECTED" and after.snapshot==stopped.snapshot
          print("RESUME_RESTART=PASS")

          # 4) Recovery supersession matrix.
          def make_at_phase(target):
              w=MissionWorkflow("run-chat08-sup-"+target.lower().replace("_","-"),mission(watchdog=1,recovery=2))
              if target=="PREFLIGHT":
                  apply_ok(w,sig("START",0))
                  return w, sig("PREFLIGHT_OK",100)
              apply_ok(w,sig("START",0)); apply_ok(w,sig("PREFLIGHT_OK",1))
              if target=="WORLD_ROUTE":
                  return w, sig("ROUTE_STEP_PROVEN",100)
              if target=="WORLD_ENCOUNTER":
                  return w, sig("ENCOUNTER_SELECTED",100,encounter="encounter-sup",map_id=1002)
              apply_ok(w,sig("ENCOUNTER_SELECTED",2,encounter="encounter-sup",map_id=1002))
              if target=="ENCOUNTER_SELECTED":
                  return w, sig("FIGHT_ENTRY_PROVEN",100,fight=1)
              apply_ok(w,sig("FIGHT_ENTRY_PROVEN",3,fight=1))
              if target=="FIGHT_ENTRY":
                  return w, sig("PARTY_JOIN_PROVEN",100,fight=1)
              apply_ok(w,sig("PARTY_JOIN_PROVEN",4,fight=1))
              if target=="PARTY_JOIN":
                  return w, sig("PLACEMENT_PROVEN",100,fight=1)
              apply_ok(w,sig("PLACEMENT_PROVEN",5,fight=1))
              if target=="PLACEMENT":
                  return w, sig("READY_PROVEN",100,fight=1)
              apply_ok(w,sig("READY_PROVEN",6,fight=1))
              if target=="READY":
                  return w, sig("FIRST_TURN_PROVEN",100,fight=1)
              apply_ok(w,sig("FIRST_TURN_PROVEN",7,fight=1))
              if target=="FIGHT_ACTIVE":
                  return w, sig("FIGHT_ENDED",100,fight=1)
              apply_ok(w,sig("FIGHT_ENDED",8,fight=1))
              if target=="FIGHT_END_RECONCILIATION":
                  return w, sig("FIGHT_OUTCOME",100,fight=1,result="VICTORY")
              apply_ok(w,sig("FIGHT_OUTCOME",9,fight=1,result="DEFEAT"))
              if target=="WORLD_REENTRY":
                  return w, sig("WORLD_REENTRY_PROVEN",100,fight=1)
              raise AssertionError(target)

          expected={
              "PREFLIGHT":"WORLD",
              "WORLD_ROUTE":"WORLD",
              "WORLD_ENCOUNTER":"ENCOUNTER_SELECTED",
              "ENCOUNTER_SELECTED":"FIGHT_ENTRY",
              "FIGHT_ENTRY":"PARTY_JOIN",
              "PARTY_JOIN":"PLACEMENT",
              "PLACEMENT":"READY",
              "READY":"FIGHT_ACTIVE",
              "FIGHT_ACTIVE":"FIGHT_END_RECONCILIATION",
              "FIGHT_END_RECONCILIATION":"WORLD_REENTRY",
              "WORLD_REENTRY":"WORLD",
          }
          for target,new_phase in expected.items():
              w,proof=make_at_phase(target)
              phase_before=w.snapshot().phase
              rec=apply_ok(w,sig("WATCHDOG",w.snapshot().watchdog_deadline_tick+1))
              assert rec.snapshot.phase=="RECOVERING" and rec.snapshot.resume_phase==phase_before,(target,rec.snapshot)
              proof=replace(proof,monotonic_tick=rec.snapshot.last_processed_tick+1)
              out=apply_ok(w,proof)
              assert out.snapshot.phase==new_phase,(target,new_phase,out.snapshot.phase,out.reason)
              assert out.snapshot.active_recovery_generation is None,(target,out.snapshot)
              late=w.apply(sig("RECOVERY_SUCCEEDED",out.snapshot.last_processed_tick+1,recovery_generation=rec.snapshot.recovery_generation))
              assert late.status=="DUPLICATE",(target,late.status,late.reason)
          print("RECOVERY_SUPERSESSION_SEMANTIC_PHASES=PASS")

          # FIGHT_ENDED overtakes recovery from every legal fight phase.
          for source in ("FIGHT_ENTRY","PARTY_JOIN","PLACEMENT","READY","FIGHT_ACTIVE"):
              w=MissionWorkflow("run-chat08-end-"+source.lower(),mission(watchdog=1,recovery=2))
              apply_ok(w,sig("START",0));apply_ok(w,sig("PREFLIGHT_OK",1))
              apply_ok(w,sig("ENCOUNTER_SELECTED",2,encounter="encounter-end",map_id=1003))
              apply_ok(w,sig("FIGHT_ENTRY_PROVEN",3,fight=1))
              if source in ("PARTY_JOIN","PLACEMENT","READY","FIGHT_ACTIVE"):
                  apply_ok(w,sig("PARTY_JOIN_PROVEN",4,fight=1))
              if source in ("PLACEMENT","READY","FIGHT_ACTIVE"):
                  apply_ok(w,sig("PLACEMENT_PROVEN",5,fight=1))
              if source in ("READY","FIGHT_ACTIVE"):
                  apply_ok(w,sig("READY_PROVEN",6,fight=1))
              if source=="FIGHT_ACTIVE":
                  apply_ok(w,sig("FIRST_TURN_PROVEN",7,fight=1))
              assert w.snapshot().phase==source
              rec=apply_ok(w,sig("WATCHDOG",w.snapshot().watchdog_deadline_tick+1))
              ended=apply_ok(w,sig("FIGHT_ENDED",rec.snapshot.last_processed_tick+1,fight=1))
              assert ended.snapshot.phase=="FIGHT_END_RECONCILIATION",(source,ended.snapshot)
              assert ended.snapshot.active_recovery_generation is None
          print("FIGHT_END_SUPERSESSION=PASS")

          print("CHAT08_PHASE_B_ADVERSARIAL_MATRIX=PASS")
          PY
