name: chat08-pr26-same-poll-finality-qa

on:
  push:
    branches: [agent/08-adversarial-qa]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  TARGET_SHA: 1fd64829d36ec5aca61ee58c0c31b23ebabe242c
  QA_REGRESSION_SHA: 00c264a38c991ebb1c1ff2f07b6051ece627b416

jobs:
  exact-head-pr26-same-poll-finality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR26 head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Assert exact source identity
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$actual"
          test "$actual" = "$TARGET_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-p1.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-p1.txt

      - name: Compile Capture Protocol
        run: python -m compileall -q src/anka_capture src/anka_protocol

      - name: Run Agent02 exact-head suites
        run: python -m pytest -q tests/test_agent02_*.py

      - name: Materialize permanent Chat08 regression unchanged
        run: |
          git show "$QA_REGRESSION_SHA:tests/test_agent08_capture_poll_overlap_finality.py" > /tmp/chat08_regression.py
          git show "$QA_REGRESSION_SHA:tests/test_agent08_capture_poll_overlap_finality.py" | sha256sum
          cp /tmp/chat08_regression.py tests/test_agent08_capture_poll_overlap_finality.py
          git diff --no-index /tmp/chat08_regression.py tests/test_agent08_capture_poll_overlap_finality.py

      - name: Run unchanged permanent Chat08 regression
        run: python -m pytest -q tests/test_agent08_capture_poll_overlap_finality.py

      - name: Run required Capture Protocol matrix
        continue-on-error: true
        run: |
          python -m pytest -q             tests/test_m4_wire_envelopes.py             tests/test_capture_transport.py             tests/test_capture_live.py             tests/test_p51_windows_flow_owner_stability.py             tests/test_p62_capture_loss_metadata.py             tests/test_p65_capture_abort_integrity.py             tests/test_capture_architecture.py             tests/test_protocol_architecture.py             tests/test_m5_protocol_sdk.py

      - name: Independent same-poll finality matrix
        run: |
          python - <<'PY'
          from anka_capture.stream import TransportEnvelopeAssembler
          from anka_contracts.capture import CapturedTcpSegment, CapturePoll
          from anka_contracts.protocol import ProtocolAdmissionDecision
          from anka_protocol.adapters.dofus_3_7_10_10.adapter import Historical371010Adapter
          from anka_protocol.adapters.dofus_3_7_10_10.manifest import descriptor
          from anka_protocol.sdk import ProtocolTransaction

          TRUSTED={"COMPLETE","CONTIGUOUS","RECONNECTED"}

          def seg(flow,seq,payload=b"",*,n,flags=0x18,direction="server_to_client"):
              return CapturedTcpSegment(flow,direction,seq,payload,n,flags)

          def poll(*segments):
              return CapturePoll("source-chat08-pr26-finality",tuple(segments),0,False,False,"AVAILABLE_CLEAN")

          def assembler(bindings=None):
              return TransportEnvelopeAssembler(
                  capture_session_id="capture-chat08-pr26-finality",
                  flow_clients=bindings or {"flow-a":"client-cra"},
              )

          def assert_no_trusted(envs, *, generation=1, connection_id=None):
              bad=[]
              for e in envs:
                  if e.connection_generation != generation:
                      continue
                  if connection_id is not None and e.connection_id != connection_id:
                      continue
                  if e.continuity in TRUSTED:
                      bad.append((e.connection_id,e.connection_generation,e.direction,e.continuity,e.payload))
              assert not bad,bad

          # 1. Original red case.
          a=assembler()
          good=b"semantic-frame"
          conflict=bytes([good[0]^1])+good[1:]
          out=a.consume_poll(poll(
              seg("flow-a",100,n=1,flags=0x02),
              seg("flow-a",101,good,n=2),
              seg("flow-a",101,conflict,n=3),
          ))
          assert a.health().status=="UNCERTAIN"
          assert len(out)==1 and out[0].continuity=="GAP_INSIDE",[(e.continuity,e.payload) for e in out]
          assert_no_trusted(out)

          # 2. Multiple staged envelopes.
          a=assembler()
          out=a.consume_poll(poll(
              seg("flow-a",100,n=1,flags=0x02),
              seg("flow-a",101,b"A",n=2),
              seg("flow-a",102,b"B",n=3),
              seg("flow-a",101,b"X",n=4),
          ))
          assert len(out)==2
          assert all(e.continuity=="GAP_INSIDE" for e in out),[(e.continuity,e.payload) for e in out]

          # 3. Cross-direction same generation.
          a=assembler()
          out=a.consume_poll(poll(
              seg("flow-a",100,n=1,flags=0x02,direction="server_to_client"),
              seg("flow-a",500,n=2,flags=0x02,direction="client_to_server"),
              seg("flow-a",101,b"S",n=3,direction="server_to_client"),
              seg("flow-a",501,b"C",n=4,direction="client_to_server"),
              seg("flow-a",101,b"X",n=5,direction="server_to_client"),
          ))
          assert len(out)==2
          assert all(e.continuity=="GAP_INSIDE" for e in out),[(e.direction,e.continuity) for e in out]

          # 4. Unrelated flow remains trusted.
          a=assembler({"flow-a":"client-cra","flow-b":"client-enu"})
          out=a.consume_poll(poll(
              seg("flow-a",100,n=1,flags=0x02),
              seg("flow-b",200,n=2,flags=0x02),
              seg("flow-a",101,b"A",n=3),
              seg("flow-b",201,b"B",n=4),
              seg("flow-a",101,b"X",n=5),
          ))
          by_client={e.client_instance_id:e for e in out}
          assert by_client["client-cra"].continuity=="GAP_INSIDE"
          assert by_client["client-enu"].continuity=="COMPLETE"

          # 5. Fresh generation later in same poll remains clean/reconnected.
          a=assembler()
          out=a.consume_poll(poll(
              seg("flow-a",100,n=1,flags=0x02),
              seg("flow-a",101,b"A",n=2),
              seg("flow-a",101,b"X",n=3),
              seg("flow-a",102,n=4,flags=0x04),
              seg("flow-a",500,n=5,flags=0x02),
              seg("flow-a",501,b"B",n=6),
          ))
          gen1=[e for e in out if e.connection_generation==1]
          gen2=[e for e in out if e.connection_generation==2]
          assert gen1 and all(e.continuity=="GAP_INSIDE" for e in gen1),[(e.connection_generation,e.continuity,e.payload) for e in out]
          assert len(gen2)==1 and gen2[0].continuity=="RECONNECTED",[(e.connection_generation,e.continuity,e.payload) for e in out]

          # 6. Pending/reordered drain staged before later conflict.
          a=assembler()
          out=a.consume_poll(poll(
              seg("flow-a",100,n=1,flags=0x02),
              seg("flow-a",104,b"DE",n=2),
              seg("flow-a",101,b"ABC",n=3),
              seg("flow-a",101,b"XBC",n=4),
          ))
          assert len(out)==2
          assert all(e.continuity=="GAP_INSIDE" for e in out),[(e.continuity,e.payload) for e in out]

          # 7. Exact matching retransmission creates no false fence.
          a=assembler()
          out=a.consume_poll(poll(
              seg("flow-a",100,n=1,flags=0x02),
              seg("flow-a",101,b"AB",n=2),
              seg("flow-a",101,b"AB",n=3),
          ))
          assert a.health().status=="CLEAN"
          assert len(out)==1 and out[0].continuity=="COMPLETE"

          # 8. Proof-window expiry becomes uncertainty and retro-fences.
          a=assembler()
          payload=b"A"*4097
          out=a.consume_poll(poll(
              seg("flow-a",100,n=1,flags=0x02),
              seg("flow-a",101,payload,n=2),
              seg("flow-a",101,b"A",n=3),
          ))
          assert a.health().status=="UNCERTAIN"
          assert len(out)==1 and out[0].continuity=="GAP_INSIDE"

          # 9. Conflict first keeps future same-generation payload fenced.
          a=assembler()
          a.feed(seg("flow-a",100,n=1,flags=0x02))
          a.feed(seg("flow-a",101,b"A",n=2))
          assert a.feed(seg("flow-a",101,b"X",n=3))==()
          later=a.feed(seg("flow-a",102,b"B",n=4))[0]
          assert later.continuity=="GAP_INSIDE"

          # 10. Capture -> real Protocol: zero semantic admissions in original red case.
          def varint(v):
              out=[]
              while v>=128:
                  out.append((v&127)|128); v >>= 7
              out.append(v); return bytes(out)
          def field(n,v):
              return varint((n<<3)|2)+varint(len(v))+v
          def framed_any(name,body):
              anymsg=field(1,b"type.ankama.com/"+name.encode("ascii"))+field(2,body)
              return varint(len(anymsg))+anymsg

          JTK=bytes.fromhex("0a1b221110010a0d080b10feffffffffffffffff01220610170a020805108906")
          frame=framed_any("jtk",JTK)
          bad=bytes([frame[0]^1])+frame[1:]
          a=assembler()
          returned=a.consume_poll(poll(
              seg("flow-a",100,n=1,flags=0x02),
              seg("flow-a",101,frame,n=2),
              seg("flow-a",101,bad,n=3),
          ))
          assert len(returned)==1 and returned[0].continuity=="GAP_INSIDE"

          class Admission:
              def __init__(self): self.seen=[]
              def admit_candidate_batch(self,batch):
                  self.seen.append(batch)
                  return ProtocolAdmissionDecision("COMMITTED",len(self.seen),None)

          admission=Admission()
          env=returned[0]
          adapter=Historical371010Adapter(
              descriptor=descriptor(),
              account_id="acct-cra",
              client_instance_id="client-cra",
              connection_id=env.connection_id,
              connection_generation=env.connection_generation,
          )
          txn=ProtocolTransaction(adapter,admission)
          result=txn.process(env)
          assert result.status=="REJECTED_TRANSPORT",result
          assert txn.poisoned
          assert admission.seen==[],len(admission.seen)

          print("CHAT08_SAME_POLL_MATRIX=PASS")
          print("ORIGINAL_RED_CASE=PASS")
          print("MULTIPLE_STAGED=PASS")
          print("CROSS_DIRECTION=PASS")
          print("UNRELATED_FLOW=PASS")
          print("FRESH_GENERATION_SAME_POLL=PASS")
          print("PENDING_DRAIN=PASS")
          print("EXACT_RETRANSMISSION=PASS")
          print("PROOF_WINDOW_EXPIRY=PASS")
          print("CONFLICT_FIRST=PASS")
          print("CAPTURE_TO_PROTOCOL_ADMISSIONS=0")
          PY
