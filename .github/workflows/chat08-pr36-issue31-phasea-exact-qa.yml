name: chat08-pr36-issue31-phasea-exact-qa

on:
  push:
    branches: [agent/08-adversarial-qa]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  TARGET_SHA: 448f449ed0fb3c3d9557e3627d6e4c3f853a7151

jobs:
  exact-head-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR36 head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Assert exact source identity
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$actual"
          test "$actual" = "$TARGET_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-p1.txt

      - name: Compile affected packages
        run: python -m compileall -q src/anka_contracts src/anka_protocol src/anka_canonical

      - name: Focused Issue31 suite
        run: python -m pytest -q tests/test_agent10_issue31_client_identity_contract.py

      - name: Protocol contract and wire suites
        run: |
          python -m pytest -q             tests/test_m5_protocol_sdk.py             tests/test_protocol_wire.py             tests/test_protocol_integration.py             tests/test_m4_wire_envelopes.py

      - name: Protocol Canonical integration and canonical digest suites
        run: |
          python -m pytest -q             tests/test_m6_m7_protocol_canonical_integration.py             tests/test_m6_m7_canonical_state.py             tests/test_p56_source_bound_batch_receipts.py

      - name: Architecture suites excluding release-seal-coupled P21
        run: |
          python -m pytest -q tests/test_m1_architecture_gate.py tests/test_protocol_architecture.py tests/test_capture_architecture.py tests/test_semantic_p7_architecture.py

      - name: P21 target diagnostic expected unresealed
        continue-on-error: true
        run: python -m pytest -q tests/test_p21_architecture_readiness.py

      - name: P21 accepted-base comparison
        continue-on-error: true
        run: |
          git worktree add /tmp/phasea-base 47803bd57e4a37931f019df31236264892e95e72
          cd /tmp/phasea-base
          PYTHONPATH="$PWD/src" python -m pytest -q tests/test_p21_architecture_readiness.py

      - name: Independent Issue31 EXPAND compatibility matrix
        run: |
          python - <<'PY'
          from dataclasses import FrozenInstanceError, asdict, fields
          from hashlib import sha256
          import json
          from pathlib import Path
          import tempfile

          from anka_contracts.canonical import CanonicalCandidate
          from anka_contracts.evidence import EvidencePointer
          from anka_contracts.protocol import (
              AdapterReleaseDescriptor,
              BoundWireEnvelopeRef,
              CandidateCanonicalBatch,
              DecoderCheckpointRef,
              ProtocolAdmissionDecision,
              WireEnvelopeRef,
              derive_protocol_client_binding,
          )
          from anka_contracts.wire import WireEnvelope
          from anka_canonical.writer import (
              CanonicalWriter,
              ExactReleaseAdmissionPolicy,
              _source_digest,
          )
          from anka_protocol.adapters.dofus_3_7_10_10.adapter import (
              BUILD, RELEASE_ID, Historical371010Adapter,
          )
          from anka_protocol.sdk.runtime import ProtocolTransaction

          EXPECT_LEGACY='a958cad9999b3ccfa7491dc47a82e8579f6038e8a9fdf26e029a5289870e6965'
          EXPECT_NORMAL='dd5e57220eb57fb4eb0052dc61a47fa197dccc07ae0cb0366a1e955c7daaff08'
          FIELDS=(
              'capture_session_id','connection_id','connection_generation',
              'producer_sequence','direction','continuity','payload_sha256',
          )

          def envelope(client='client-cra',seq=1,payload=b'wire',capture='capture-issue31'):
              return WireEnvelope(
                  capture,client,'conn-issue31','server_to_client',0,seq,
                  '2026-10-26T00:00:00+00:00',seq,payload,
                  continuity='COMPLETE',transport_end_offset=len(payload),
                  connection_generation=1,source_packet_number=seq,
                  timestamp_provenance='TEST_FIXTURE',
              )

          def evidence(tag):
              digest=sha256(tag.encode()).hexdigest()
              return EvidencePointer(
                  'evidence-'+digest[:32],'OBSERVED_EXTERNAL','anka_protocol',
                  'issue31:'+digest,digest,'ISSUE31_PHASE_A',
              )

          def candidate(tag,client='client-cra',account='acct-cra'):
              digest=sha256(tag.encode()).hexdigest()
              return CanonicalCandidate(
                  'candidate-'+digest[:32],'ACTOR_SEEN',account,client,
                  (evidence(tag),),(('actor_id','41'),),
              )

          def cp():
              return DecoderCheckpointRef('adapter-issue31-r1','Dofus Issue31','conn-issue31',1,1,'1'*64)

          def batch(refs,candidates=(),bid='batch-issue31'):
              candidates=tuple(candidates)
              return CandidateCanonicalBatch(
                  bid,'adapter-issue31-r1','Dofus Issue31','conn-issue31',1,
                  tuple(refs),candidates,
                  'SEMANTIC_CANDIDATES' if candidates else 'FRAMING_IN_PROGRESS',
                  cp(),
              )

          def accepted_base_ref(source):
              return WireEnvelopeRef(
                  source.capture_session_id,source.connection_id,source.connection_generation,
                  source.producer_sequence,source.direction,source.continuity,
                  sha256(source.payload).hexdigest(),
              )

          # Accepted-base shape and exact Canonical digest compatibility.
          legacy=WireEnvelopeRef(
              'capture-legacy','conn-issue31',1,7,
              'server_to_client','COMPLETE','a'*64,
          )
          assert tuple(x.name for x in fields(WireEnvelopeRef))==FIELDS
          assert tuple(asdict(legacy).keys())==FIELDS
          assert len(asdict(legacy))==7

          source=envelope()
          bound=WireEnvelopeRef.from_envelope(source)
          assert isinstance(bound,BoundWireEnvelopeRef)
          assert tuple(asdict(bound).keys())==FIELDS
          assert len(asdict(bound))==7
          assert 'client_instance_id' not in asdict(bound)

          legacy_batch=batch((legacy,),bid='batch-legacy')
          normal_batch=batch((bound,),bid='batch-normal')
          assert _source_digest(legacy_batch)==EXPECT_LEGACY,_source_digest(legacy_batch)
          assert _source_digest(normal_batch)==EXPECT_NORMAL,_source_digest(normal_batch)

          # Independently recompute, not by comparing helper strings to themselves.
          def recompute(b):
              obj={
                  'adapter_release_id':b.adapter_release_id,
                  'observed_client_build':b.observed_client_build,
                  'connection_id':b.connection_id,
                  'connection_generation':b.connection_generation,
                  'source_envelopes':[asdict(x) for x in b.source_envelopes],
              }
              raw=json.dumps(obj,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False)
              return sha256(raw.encode()).hexdigest()
          assert recompute(legacy_batch)==EXPECT_LEGACY
          assert recompute(normal_batch)==EXPECT_NORMAL
          print('EXACT_CANONICAL_DIGESTS=PASS')

          # Bound authority equality/hash/immutability.
          same1=WireEnvelopeRef.from_envelope(source)
          same2=WireEnvelopeRef.from_envelope(source)
          assert same1==same2 and hash(same1)==hash(same2)
          assert same1 in (same2,) and same1 in [same2]
          cra=WireEnvelopeRef.from_envelope(envelope(client='client-cra',payload=b'same'))
          enu=WireEnvelopeRef.from_envelope(envelope(client='client-enu',payload=b'same'))
          assert asdict(cra)==asdict(enu)
          assert cra!=enu
          assert cra.source_identity_sha256!=enu.source_identity_sha256
          unbound=accepted_base_ref(source)
          assert asdict(bound)==asdict(unbound)
          assert bound!=unbound and unbound!=bound
          try:
              bound.client_instance_id='client-enu'
          except FrozenInstanceError:
              pass
          else:
              raise AssertionError('bound client identity mutable')
          try:
              BoundWireEnvelopeRef(
                  unbound.capture_session_id,unbound.connection_id,
                  unbound.connection_generation,unbound.producer_sequence,
                  unbound.direction,unbound.continuity,unbound.payload_sha256,
                  'client-forged',
              )
          except ValueError as exc:
              assert 'BOUND_WIRE_REF_REQUIRES_ENVELOPE' in str(exc)
          else:
              raise AssertionError('direct bound construction accepted')
          print('BOUND_REF_AUTHORITY=PASS')

          # Binding classifications and account/client separation.
          same_refs=(
              WireEnvelopeRef.from_envelope(envelope(client='client-cra',seq=1,payload=b'a')),
              WireEnvelopeRef.from_envelope(envelope(client='client-cra',seq=2,payload=b'b')),
          )
          assert batch(same_refs,(candidate('ok'),),bid='batch-proven').client_binding.status=='PROVEN'
          mixed=(
              WireEnvelopeRef.from_envelope(envelope(client='client-cra',seq=1,payload=b'a')),
              WireEnvelopeRef.from_envelope(envelope(client='client-enu',seq=2,payload=b'b')),
          )
          assert batch(mixed,bid='batch-conflict').client_binding.status=='SOURCE_CONFLICT'
          assert batch((bound,unbound),bid='batch-legacy-unbound').client_binding.status=='LEGACY_UNBOUND'
          wrong=batch((bound,),(candidate('wrong',client='client-enu',account='acct-enu'),),bid='batch-wrong')
          assert wrong.client_binding.status=='CANDIDATE_MISMATCH'
          first=derive_protocol_client_binding(wrong)
          assert first.status=='CANDIDATE_MISMATCH'
          framing=batch((bound,),(),bid='batch-framing')
          assert framing.decode_health=='FRAMING_IN_PROGRESS'
          assert framing.client_binding.status=='PROVEN'
          assert framing.client_binding.source_client_instance_id=='client-cra'
          separate=batch(
              (bound,),
              (candidate('separate',client='client-cra',account='acct-explicit-other'),),
              bid='batch-account-separate',
          )
          assert separate.client_binding.status=='PROVEN'
          assert separate.candidates[0].account_id=='acct-explicit-other'
          assert not hasattr(separate.client_binding,'account_id')
          source_identity=separate.source_identity_sha256
          relabeled=batch(
              (bound,),
              (candidate('relabel',client='client-enu',account='acct-explicit-other'),),
              bid='batch-relabel',
          )
          assert relabeled.source_identity_sha256==source_identity
          assert relabeled.client_binding.status=='CANDIDATE_MISMATCH'
          print('BINDING_CLASSIFICATIONS=PASS')

          # Real adapter path + real Protocol current-ref causal checks.
          descriptor=AdapterReleaseDescriptor(
              RELEASE_ID,BUILD,'c'*64,'d'*64,1,0,'REPLAY_CERTIFIED'
          )
          adapter=Historical371010Adapter(
              descriptor=descriptor,account_id='acct-cra',client_instance_id='client-cra',
              connection_id='conn-real',connection_generation=1,
          )
          real=WireEnvelope(
              'capture-real','client-cra','conn-real','server_to_client',0,1,
              '2026-10-26T00:00:00+00:00',1,b'\x00',
              continuity='COMPLETE',transport_end_offset=1,
              connection_generation=1,source_packet_number=1,
              timestamp_provenance='TEST_FIXTURE',
          )
          produced=adapter.decode_envelope(real)
          current_ref=WireEnvelopeRef.from_envelope(real)
          assert current_ref in produced.source_envelopes
          assert produced.source_envelopes[-1]==current_ref
          assert all(isinstance(x,BoundWireEnvelopeRef) for x in produced.source_envelopes)
          assert produced.client_binding.status=='PROVEN'
          print('REAL_ADAPTER_BOUND_SOURCE=PASS')

          # Buffered same-client refs remain representable through real adapter.
          adapter2=Historical371010Adapter(
              descriptor=descriptor,account_id='acct-cra',client_instance_id='client-cra',
              connection_id='conn-buffer',connection_generation=1,
          )
          e1=WireEnvelope(
              'capture-buffer','client-cra','conn-buffer','server_to_client',0,1,
              '2026-10-26T00:00:00+00:00',1,b'\x02',
              continuity='COMPLETE',transport_end_offset=1,
              connection_generation=1,source_packet_number=1,
              timestamp_provenance='TEST_FIXTURE',
          )
          e2=WireEnvelope(
              'capture-buffer','client-cra','conn-buffer','server_to_client',1,2,
              '2026-10-26T00:00:01+00:00',2,b'\x00\x00',
              continuity='COMPLETE',transport_start_offset=1,transport_end_offset=3,
              connection_generation=1,source_packet_number=2,
              timestamp_provenance='TEST_FIXTURE',
          )
          b1=adapter2.decode_envelope(e1)
          b2=adapter2.decode_envelope(e2)
          assert all(isinstance(x,BoundWireEnvelopeRef) for x in b1.source_envelopes+b2.source_envelopes)
          assert all(x.client_instance_id=='client-cra' for x in b1.source_envelopes+b2.source_envelopes)
          print('BUFFERED_BOUND_REFS=PASS')

          # Actual Canonical writer: pre-upgrade legacy then current bound replay
          # with same batch id must remain an idempotent duplicate, not conflict.
          class NoopProjector:
              def prepare(self,previous,events):
                  return previous
          policy=ExactReleaseAdmissionPolicy((('adapter-issue31-r1','Dofus Issue31'),))
          with tempfile.TemporaryDirectory() as td:
              writer=CanonicalWriter(Path(td)/'canonical.sqlite',projector=NoopProjector(),admission_policy=policy)
              pre=batch((accepted_base_ref(source),),(),bid='batch-replay')
              post=batch((WireEnvelopeRef.from_envelope(source),),(),bid='batch-replay')
              first_receipt=writer.commit_candidate_batch(pre)
              second_receipt=writer.commit_candidate_batch(post)
              assert second_receipt.status=='IDEMPOTENT_DUPLICATE',second_receipt
              writer.close()
          print('CANONICAL_PREUPGRADE_REPLAY_IDEMPOTENT=PASS')

          print('CHAT08_ISSUE31_PHASE_A_INDEPENDENT_MATRIX=PASS')
          PY
