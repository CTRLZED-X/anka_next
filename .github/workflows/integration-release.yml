name: integration-release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

concurrency:
  group: integration-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-seal-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-p1.txt
            pyproject.toml

      - name: Install pinned verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-p1.txt

      - name: Verify sealed release and source-bound receipts
        run: python tools/verify_release_offline.py

  windows-integration:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-p1.txt
            requirements-windows-capture.txt
            pyproject.toml

      - name: Install pinned test and Windows capture dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-p1.txt -r requirements-windows-capture.txt

      - name: Verify Windows runtime file integrity
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from anka_app.release_integrity import verify_release_integrity; r=verify_release_integrity(Path('.')); print(r.safe_receipt()); raise SystemExit(0 if r.status == 'PASS' else 1)"

      - name: Architecture and contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_m1_architecture_gate.py" -v
          python -m unittest discover -s tests -p "test_m1_contracts_lab.py" -v
          python -m unittest tests.test_p21_architecture_readiness.TestP21Architecture -v
          python -m unittest tests.test_p21_architecture_readiness.TestP21LiveReadiness.test_setup_records_architecture_and_readiness_evidence tests.test_p21_architecture_readiness.TestP21LiveReadiness.test_two_operator_commands_remain -v

      - name: Configuration and startup readiness
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_configuration.py" -v
          python -m unittest discover -s tests -p "test_m12_003_live_readiness_hardening.py" -v

      - name: Windows verification-runner smoke
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from anka_app.verification_runner import VerificationRejected, verify_isolated
          with TemporaryDirectory() as td:
              root = Path(td)
              (root / "tests").mkdir()
              (root / "src").mkdir()
              for i in range(3):
                  (root / "tests" / f"test_case_{i}.py").write_text(
                      "import unittest\nclass Unit(unittest.TestCase):\n"
                      "    def test_truth(self): self.assertTrue(True)\n",
                      encoding="utf-8",
                  )
              try:
                  result = verify_isolated(root, shards=2, per_shard_timeout=20)
              except VerificationRejected as exc:
                  print("VERIFICATION_SMOKE_CODE=" + exc.code)
                  print("VERIFICATION_SMOKE_MODULES=" + repr(exc.modules))
                  print("VERIFICATION_SMOKE_OUTPUT_BEGIN")
                  print(exc.output)
                  print("VERIFICATION_SMOKE_OUTPUT_END")
                  raise
              print("VERIFICATION_SMOKE=" + result.status)
          '@ | python -

      - name: Release and verification integrity
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_m12_composition_packaging.py" -v
          python -m unittest discover -s tests -p "test_m12_005_release_truth_and_observer_isolation.py" -v
          python -m unittest discover -s tests -p "test_p24_verification_runner.py" -v
          python -m unittest discover -s tests -p "test_p37_checkpointed_verification.py" -v
