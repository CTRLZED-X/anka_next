name: chat08-issue32-phasea-qa

on:
  push:
    branches: [agent/08-adversarial-qa]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  TARGET_SHA: 502ae058eeb0df41b07afe0a73e3f7e131ff4340

jobs:
  exact-head-issue32-phasea:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR34 head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Assert exact source identity
        run: |
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$actual"
          test "$actual" = "$TARGET_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-p1.txt

      - name: Compile contract and App migration
        run: python -m compileall -q src/anka_contracts src/anka_app

      - name: Run committed Phase A tests
        run: python -m pytest -q tests/test_agent10_issue32_workflow_contract_migration.py

      - name: Run existing Workflow and contract regression matrix
        run: |
          python -m pytest -q             tests/test_m9_m10_generated.py             tests/test_m9_m10_q6.py             tests/test_p17_coordination_workflow.py             tests/test_m1_contracts_lab.py             tests/test_m1_architecture_gate.py

      - name: Independent required Phase A matrix
        run: |
          python - <<'PY'
          from dataclasses import asdict, replace
          from hashlib import sha256
          import json

          from anka_app.workflow_persistence import (
              admit_workflow_resume,
              admit_workflow_signal_tick,
              dump_workflow_snapshot,
              load_workflow_snapshot,
              persist_workflow_signal_tick,
              prepare_recovery_outcome_signal,
          )
          from anka_contracts.workflow import WorkflowSnapshot

          def token(run_id, phase, fight_epoch, counters, route_index, pending, counted, started, generation):
              return sha256(json.dumps({
                  'run':run_id,'phase':phase,'fight':fight_epoch,'counters':counters,
                  'route':route_index,'pending':pending,'counted':counted,'started':started,
                  'generation':generation
              },sort_keys=True,separators=(',',':')).encode()).hexdigest()

          def snap(**kw):
              data=dict(
                  run_id='run-chat08-issue32',
                  phase='RECOVERING',
                  fight_epoch=1,
                  attempts=0,wins=0,losses=0,unknowns=0,aborted=0,
                  route_index=0,
                  pending_action_id=None,
                  counted_fight_epochs=(),
                  started_fight_epochs=(1,),
                  processed_signal_ids=('wfsig-old',),
                  progress_generation=4,
                  progress_token='a'*64,
                  phase_started_tick=90,
                  watchdog_deadline_tick=105,
                  recovery_budget_remaining=1,
                  resume_phase='READY',
                  expected_next_evidence=('RECOVERY_SUCCEEDED','RECOVERY_FAILED'),
                  terminal_reason=None,
                  goal_reached_pending_reentry=False,
                  plan_id='missionplan-chat08',
                  selected_encounter_id=None,
                  selected_encounter_map_id=None,
                  recovery_generation=2,
                  active_recovery_generation=2,
                  last_processed_tick=100,
              )
              data.update(kw)
              return WorkflowSnapshot(**data)

          # stale A cannot settle B; matching B can.
          s=snap()
          for kind in ('RECOVERY_SUCCEEDED','RECOVERY_FAILED'):
              stale=prepare_recovery_outcome_signal(
                  s,signal_id='wfsig-stale-'+kind.lower(),kind=kind,
                  monotonic_tick=101,recovery_generation=1,
              )
              assert stale.admission.status=='REJECTED',stale
              current=prepare_recovery_outcome_signal(
                  s,signal_id='wfsig-current-'+kind.lower(),kind=kind,
                  monotonic_tick=101,recovery_generation=2,
              )
              assert current.admission.status=='ALLOWED',current

          missing=prepare_recovery_outcome_signal(
              s,signal_id='wfsig-missing',kind='RECOVERY_SUCCEEDED',
              monotonic_tick=101,recovery_generation=None,
          )
          assert missing.admission.status=='REJECTED'

          settled=replace(s,phase='READY',resume_phase=None,active_recovery_generation=None,
                          phase_started_tick=101,watchdog_deadline_tick=106,last_processed_tick=101)
          duplicate=prepare_recovery_outcome_signal(
              settled,signal_id='wfsig-dupe',kind='RECOVERY_SUCCEEDED',
              monotonic_tick=100,recovery_generation=2,
          )
          assert duplicate.admission.status=='IDEMPOTENT'
          assert duplicate.signal is None

          # Durable time watermark.
          world=replace(settled,phase='WORLD',phase_started_tick=1,watchdog_deadline_tick=6,
                        last_processed_tick=100)
          assert admit_workflow_resume(world,50).status=='REJECTED'
          assert admit_workflow_resume(world,100).status=='ALLOWED'
          assert admit_workflow_signal_tick(world,99).status=='REJECTED'
          assert admit_workflow_signal_tick(world,100).status=='ALLOWED'
          rejected=persist_workflow_signal_tick(world,120,accepted=False)
          assert rejected is world
          advanced=persist_workflow_signal_tick(world,120,accepted=True)
          assert advanced.last_processed_tick==120
          assert advanced.phase_started_tick==1
          assert advanced.watchdog_deadline_tick==6
          assert advanced.progress_generation==world.progress_generation

          # Current-schema RECOVERING snapshot must not be resumable with no
          # semantic recovery target. Baseline engine's RECOVERY_SUCCEEDED path
          # requires s.resume_phase to leave RECOVERING.
          no_target=replace(s,resume_phase=None)
          loaded=load_workflow_snapshot(dump_workflow_snapshot(no_target))
          print("NO_TARGET_CLASSIFICATION="+loaded.classification)
          print("NO_TARGET_RESUME_AUTHORIZED="+str(loaded.resume_authorized))
          print("NO_TARGET_ADMISSION="+admit_workflow_resume(no_target,100).status)
          assert not loaded.resume_authorized, (
              "RECOVERING snapshot without resume_phase was classified resumable"
          )
          assert admit_workflow_resume(no_target,100).status=='REJECTED'

          # Legacy CREATED safe bootstrap should match the deterministic
          # constructor shape, including its derived progress token.
          pristine=WorkflowSnapshot(
              run_id='run-chat08-pristine', phase='CREATED', fight_epoch=0,
              attempts=0,wins=0,losses=0,unknowns=0,aborted=0,route_index=0,
              pending_action_id=None,counted_fight_epochs=(),started_fight_epochs=(),
              processed_signal_ids=(),progress_generation=0,
              progress_token=token('run-chat08-pristine','CREATED',0,(0,0,0,0,0),0,None,(),(),0),
              phase_started_tick=0,watchdog_deadline_tick=None,recovery_budget_remaining=2,
              resume_phase=None,expected_next_evidence=('START',),terminal_reason=None,
              goal_reached_pending_reentry=False,plan_id='missionplan-chat08',
              selected_encounter_id=None,selected_encounter_map_id=None,
              recovery_generation=None,active_recovery_generation=None,last_processed_tick=None,
          )
          legacy=asdict(pristine)
          for k in ('recovery_generation','active_recovery_generation','last_processed_tick'):
              legacy.pop(k)
          good=load_workflow_snapshot(legacy)
          assert good.classification=='SAFE' and good.resume_authorized

          tampered=dict(legacy)
          tampered['progress_token']='f'*64
          bad=load_workflow_snapshot(tampered)
          print("TAMPERED_TOKEN_CLASSIFICATION="+bad.classification)
          print("TAMPERED_TOKEN_RESUME_AUTHORIZED="+str(bad.resume_authorized))
          assert not bad.resume_authorized, (
              "legacy CREATED with non-constructor progress_token was promoted to SAFE authority"
          )

          print("CHAT08_ISSUE32_PHASEA_REQUIRED_MATRIX=PASS")
          PY
